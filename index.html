<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphractal — See what the market can't hide</title>
    <meta
      name="description"
      content="On-chain, derivatives, sentiment and macro in one terminal — with 23 proprietary models and an AI that cites every number it uses. Free to start, no credit card."
    />
    <meta name="theme-color" content="#0B0D14" />
    <meta property="og:title" content="Alphractal — See what the market can't hide" />
    <meta
      property="og:description"
      content="One terminal for on-chain, derivatives, sentiment and macro data, with an AI that cites every number it uses."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alphractal.com/" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg" />
    <link rel="canonical" href="https://alphractal.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Alphractal",
        "url": "https://alphractal.com/",
        "logo": "https://alphractal.com/brand/logo-icon.svg",
        "foundingDate": "2023",
        "description": "Crypto and macroeconomic analytics platform with proprietary models and a citation-grounded research AI."
      }
    </script>
    <script>
      // Animations are opt-out for reduced motion: content stays visible, no hidden initial states.
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('js-anim')
      }
    </script>
    <style>
      /* Inline and framework-free so it paints before any bundle loads, matching the app's
         own background (--paper in tokens.css) so there's no color flash when it fades out. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf9;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash img {
        width: 46px;
        height: auto;
        animation: splash-pulse 1.15s ease-in-out infinite;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.86);
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/brand/logo-icon.svg" alt="" width="46" height="42" />
    </div>
    <!-- No JS to remove #splash above means no JS to run this app either: without it the
         prerendered markup in #root is the whole page, so don't let the splash hide it. -->
    <noscript>
      <style>
        #splash {
          display: none;
        }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.jsx"></script>
    <script>
      // Safety net: if the app bundle ever fails to mount, don't leave the splash up forever.
      setTimeout(function () {
        var s = document.getElementById('splash')
        if (s) s.classList.add('is-done')
      }, 4000)
    </script>
  </body>
</html>
